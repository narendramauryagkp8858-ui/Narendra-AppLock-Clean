
name: Narendra AppLock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Check AndroidManifest
        run: |
          echo "Checking AndroidManifest.xml"
          cat -n app/src/main/AndroidManifest.xml

      - name: Build APK
        run: gradle assembleDebug --stacktrace --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Narendra-AppLock-APK
          path: app/build/outputs/apk/debug/app-debug.apk
